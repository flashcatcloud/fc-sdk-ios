name: Release

on:
  push:
    branches:
      - publish
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v0.3.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run mode (skip actual publishing)"
        required: false
        default: true
        type: boolean

env:
  XCODE_VERSION: "16.2"

jobs:
  validate-internal:
    name: Validate FlashcatInternal
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods/repos
            Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('*.podspec') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Lint FlashcatInternal
        run: |
          bundle exec pod lib lint FlashcatInternal.podspec --allow-warnings

  validate-core:
    name: Validate FlashcatCore
    runs-on: macos-14
    needs: validate-internal
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods/repos
            Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('*.podspec') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Lint FlashcatCore
        run: |
          bundle exec pod lib lint FlashcatCore.podspec --allow-warnings --include-podspecs=FlashcatInternal.podspec

  validate-modules:
    name: Validate ${{ matrix.module }}
    runs-on: macos-14
    needs: validate-internal
    strategy:
      fail-fast: false
      matrix:
        module:
          - FlashcatTrace
          - FlashcatRUM
          - FlashcatCrashReporting
          - FlashcatWebViewTracking
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods/repos
            Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('*.podspec') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Lint ${{ matrix.module }}
        run: |
          bundle exec pod lib lint ${{ matrix.module }}.podspec --allow-warnings --include-podspecs=FlashcatInternal.podspec

  publish-cocoapods-internal:
    name: Publish CocoaPods (Internal)
    runs-on: macos-14
    needs: [validate-internal, validate-core, validate-modules]
    # Only run on tag push or manual workflow dispatch (not on publish-new branch push)
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Get Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Publish FlashcatInternal
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          bundle exec pod trunk push FlashcatInternal.podspec --allow-warnings --synchronous

  publish-cocoapods-core:
    name: Publish CocoaPods (Core)
    runs-on: macos-14
    needs: publish-cocoapods-internal
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Wait for CDN sync
        run: sleep 600 # Wait 10 minutes for CocoaPods CDN to sync FlashcatInternal

      - name: Publish FlashcatCore
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          bundle exec pod trunk push FlashcatCore.podspec --allow-warnings --synchronous

  publish-cocoapods-modules:
    name: Publish CocoaPods (Modules)
    runs-on: macos-14
    needs: publish-cocoapods-core
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
    strategy:
      matrix:
        module:
          [
            FlashcatTrace,
            FlashcatRUM,
            FlashcatCrashReporting,
            FlashcatWebViewTracking,
          ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Wait for CDN sync
        run: sleep 600 # Wait 10 minutes for CocoaPods CDN to sync FlashcatCore

      - name: Publish ${{ matrix.module }}
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          bundle exec pod trunk push ${{ matrix.module }}.podspec --allow-warnings --synchronous

  summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs:
      [
        validate-internal,
        validate-core,
        validate-modules,
        publish-cocoapods-internal,
        publish-cocoapods-core,
        publish-cocoapods-modules,
      ]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Validation Internal: ${{ needs.validate-internal.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Validation Core: ${{ needs.validate-core.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Validation Modules: ${{ needs.validate-modules.result }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.publish-cocoapods-internal.result }}" != "skipped" ]; then
            echo "- FlashcatInternal: ${{ needs.publish-cocoapods-internal.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- FlashcatCore: ${{ needs.publish-cocoapods-core.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- Modules: ${{ needs.publish-cocoapods-modules.result }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Publishing: Skipped (branch push only validates)" >> $GITHUB_STEP_SUMMARY
          fi

  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs:
      [
        publish-cocoapods-internal,
        publish-cocoapods-core,
        publish-cocoapods-modules,
      ]
    if: ${{ success() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) }}
    steps:
      - name: Notify deployment success
        uses: zcong1993/actions-ding@master
        with:
          dingToken: ${{ secrets.DING_TALK_TOKEN }}
          secret: ${{ secrets.DING_TALK_SECRET }}
          body: |
            {
              "msgtype": "markdown",
              "markdown": {
                "title": "fc-sdk-ios 发布通知",
                "text": "### ✅ fc-sdk-ios 发布成功\n\n---\n\n 🔖 版本: ${{ github.ref_name }}\n\n 📦 包名: FlashcatCore, FlashcatRUM, FlashcatTrace 等\n\n 🍎 平台: CocoaPods\n\n 👨‍💻 发布者: ${{ github.actor }}\n\n 🚀 [查看详情](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
              }
            }

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs:
      [
        validate-internal,
        validate-core,
        validate-modules,
        publish-cocoapods-internal,
        publish-cocoapods-core,
        publish-cocoapods-modules,
      ]
    if: ${{ failure() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) }}
    steps:
      - name: Notify deployment failure
        uses: zcong1993/actions-ding@master
        with:
          dingToken: ${{ secrets.DING_TALK_TOKEN }}
          secret: ${{ secrets.DING_TALK_SECRET }}
          body: |
            {
              "msgtype": "markdown",
              "markdown": {
                "title": "fc-sdk-ios 发布通知",
                "text": "### ❌ fc-sdk-ios 发布失败\n\n---\n\n 🔖 版本: ${{ github.ref_name }}\n\n 📦 包名: FlashcatCore, FlashcatRUM, FlashcatTrace 等\n\n 🍎 平台: CocoaPods\n\n 👨‍💻 发布者: ${{ github.actor }}\n\n 🚀 [查看详情](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
              }
            }
