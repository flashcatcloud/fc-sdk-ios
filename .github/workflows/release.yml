name: Release

on:
  push:
    branches:
      - publish-new
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v0.3.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run mode (skip actual publishing)"
        required: false
        default: true
        type: boolean

env:
  XCODE_VERSION: "16.2"

jobs:
  validate:
    name: Validate Podspecs
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Lint Podspecs (Internal)
        run: |
          bundle exec pod spec lint FlashcatInternal.podspec --allow-warnings

      - name: Lint Podspecs (Core)
        run: |
          bundle exec pod spec lint FlashcatCore.podspec --allow-warnings

      - name: Lint Podspecs (Modules)
        run: |
          bundle exec pod spec lint FlashcatTrace.podspec --allow-warnings
          bundle exec pod spec lint FlashcatRUM.podspec --allow-warnings
          bundle exec pod spec lint FlashcatCrashReporting.podspec --allow-warnings
          bundle exec pod spec lint FlashcatWebViewTracking.podspec --allow-warnings

  publish-cocoapods-internal:
    name: Publish CocoaPods (Internal)
    runs-on: macos-14
    needs: validate
    # Only run on tag push or manual workflow dispatch (not on publish-new branch push)
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Get Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Publish FlashcatInternal
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          bundle exec pod trunk push FlashcatInternal.podspec --allow-warnings --synchronous

  publish-cocoapods-core:
    name: Publish CocoaPods (Core)
    runs-on: macos-14
    needs: publish-cocoapods-internal
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Wait for CDN sync
        run: sleep 600 # Wait 10 minutes for CocoaPods CDN to sync FlashcatInternal

      - name: Publish FlashcatCore
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          bundle exec pod trunk push FlashcatCore.podspec --allow-warnings --synchronous

  publish-cocoapods-modules:
    name: Publish CocoaPods (Modules)
    runs-on: macos-14
    needs: publish-cocoapods-core
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
    strategy:
      matrix:
        module:
          [
            FlashcatTrace,
            FlashcatRUM,
            FlashcatCrashReporting,
            FlashcatWebViewTracking,
          ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Wait for CDN sync
        run: sleep 600 # Wait 10 minutes for CocoaPods CDN to sync FlashcatCore

      - name: Publish ${{ matrix.module }}
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          bundle exec pod trunk push ${{ matrix.module }}.podspec --allow-warnings --synchronous

  summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs:
      [
        validate,
        publish-cocoapods-internal,
        publish-cocoapods-core,
        publish-cocoapods-modules,
      ]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Validation: ${{ needs.validate.result }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.publish-cocoapods-internal.result }}" != "skipped" ]; then
            echo "- FlashcatInternal: ${{ needs.publish-cocoapods-internal.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- FlashcatCore: ${{ needs.publish-cocoapods-core.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- Modules: ${{ needs.publish-cocoapods-modules.result }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Publishing: Skipped (branch push only validates)" >> $GITHUB_STEP_SUMMARY
          fi
